# zig 0.14 depends on `sysroot_linux-aarch64 >=2.28`, which is unsolvable
# against conda-forge's default 2.17 pin, so raise the floor on that one
# platform. build.sh targets aarch64-linux-gnu.2.28 to match, keeping the
# binary's actual glibc requirement and the declared __glibc run-export in
# agreement. linux-64 is unaffected: zig has no sysroot dependency there.
c_stdlib_version:          # [linux and aarch64]
  - "2.28"                 # [linux and aarch64]
