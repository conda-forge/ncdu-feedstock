schema_version: 1

context:
  name: ncdu
  version: "2.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://dev.yorhel.nl/download/${{ name }}-${{ version }}.tar.gz
  sha256: e91135281cb66569f2ca4c0bac277246991e7e52524c0ca8cba3de5c8e81cec9

build:
  number: 0
  skip: win or ppc64le
  script:
    file: build
    env:
      # The libc floor to compile against. Passing the variant means the
      # binary's actual floor and the __glibc/__osx bound stdlib("c")
      # declares are the same number rather than two kept in sync by hand.
      # default("") keeps the win-64 render working, where the recipe is
      # skipped and c_stdlib_version is undefined; build.sh rejects an empty
      # value, so a real platform missing it fails loudly rather than
      # producing a truncated target triple.
      CONDA_C_STDLIB_VERSION: ${{ c_stdlib_version | default("") }}

requirements:
  build:
    # zig bundles its own clang and never invokes a host C compiler, so this
    # is likely droppable; it is kept because verifying that needs a macOS CI
    # run, and the macOS legs of this recipe have been the fragile ones.
    - if: osx
      then:
        - ${{ compiler('c') }}
    # Needed even though zig is self-contained: this supplies the package's
    # __glibc/__osx floor, which must match build.sh's -Dtarget triples.
    - ${{ stdlib("c") }}
    - zig >=0.15.2,<0.16
    - pkg-config
  host:
    - ncurses
    - zstd

tests:
  - script:
      - ncdu --version
  - package_contents:
      # The whole payload is these two files, so strict costs nothing.
      strict: true
      bin:
        - ncdu
      files:
        - share/man/man1/ncdu.1

about:
  license: MIT
  license_file: LICENSES/MIT.txt
  summary: NCurses Disk Usage
  description: |
    Ncdu is a disk usage analyzer with an ncurses interface. It is designed to
    find space hogs on a remote server where you don't have an entire graphical
    setup available, but it is a useful tool even on regular desktop systems.
    Ncdu aims to be fast, simple and easy to use, and should be able to run
    in any minimal POSIX-like environment with ncurses installed.
  homepage: https://dev.yorhel.nl/ncdu
  repository: https://g.blicky.net/ncdu.git/
  documentation: https://dev.yorhel.nl/ncdu/man

extra:
  recipe-maintainers:
    - chrisburr
    - carlodri
