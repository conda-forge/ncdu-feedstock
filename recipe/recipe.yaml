schema_version: 1

context:
  name: ncdu
  version: "2.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://dev.yorhel.nl/download/${{ name }}-${{ version }}.tar.gz
  sha256: 75f0ac3bce4fc012e8198b72518db5179e903079858efce08b912d5dcc7094d3

build:
  number: 0
  skip: win or ppc64le

requirements:
  build:
    # zig is a self-contained toolchain (bundled clang) and never invokes a
    # host C compiler, so compiler('c') is only wanted on macOS, where
    # build.sh reads ${MACOSX_DEPLOYMENT_TARGET} from its activation.
    - if: osx
      then:
        - ${{ compiler('c') }}
    # stdlib("c")'s run-export is what records the libc floor (__glibc >=x.y on
    # Linux, __osx >=x.y on macOS) matching the zig -Dtarget triples in
    # build.sh. Without it the package declares no libc requirement at all and
    # installs happily on hosts too old to run it.
    #
    # linux-aarch64 is the exception. There stdlib("c") pins
    # sysroot_linux-aarch64 to c_stdlib_version, and every available value is
    # wrong: 2.17 (the floor this binary actually has) is unsolvable against
    # zig's own `sysroot_linux-aarch64 >=2.28`, while 2.28 both overstates the
    # requirement and *downgrades* the sysroot zig links against from the 2.39
    # it otherwise pulls in, which segfaults zig 0.14. So leave the aarch64
    # build environment exactly as zig wants it and state the bound directly
    # in run: instead.
    - if: target_platform != "linux-aarch64"
      then:
        - ${{ stdlib("c") }}
    - zig 0.14.*
    - pkg-config
  host:
    - ncurses
    - zstd
  run:
    - ncurses
    - zstd
    # The bound stdlib("c") would have supplied everywhere else; it matches
    # -Dtarget=aarch64-linux-gnu.2.17 in build.sh.
    - if: target_platform == "linux-aarch64"
      then:
        - __glibc >=2.17

tests:
  - script:
      - ncdu --version
  - package_contents:
      # strict: the payload is only the binary zig installs and the man page
      # build.sh installs by hand, so anything else appearing (a stray zig
      # cache directory, a silently relocated man page) fails the build.
      strict: true
      bin:
        - ncdu
      files:
        - share/man/man1/ncdu.1

about:
  license: MIT
  license_file: LICENSES/MIT.txt
  summary: NCurses Disk Usage
  description: |
    Ncdu is a disk usage analyzer with an ncurses interface. It is designed to
    find space hogs on a remote server where you don't have an entire graphical
    setup available, but it is a useful tool even on regular desktop systems.
    Ncdu aims to be fast, simple and easy to use, and should be able to run
    in any minimal POSIX-like environment with ncurses installed.
  homepage: https://dev.yorhel.nl/ncdu
  repository: https://g.blicky.net/ncdu.git/
  documentation: https://dev.yorhel.nl/ncdu/man

extra:
  recipe-maintainers:
    - chrisburr
    - carlodri
