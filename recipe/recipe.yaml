schema_version: 1

context:
  name: ncdu
  version: "2.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://dev.yorhel.nl/download/${{ name }}-${{ version }}.tar.gz
  sha256: e91135281cb66569f2ca4c0bac277246991e7e52524c0ca8cba3de5c8e81cec9

build:
  number: 0
  skip: win or ppc64le

requirements:
  build:
    # zig is a self-contained toolchain (bundled clang) and never invokes a
    # host C compiler, so compiler('c') is only wanted on macOS, where
    # build.sh reads ${MACOSX_DEPLOYMENT_TARGET} from its activation.
    - if: osx
      then:
        - ${{ compiler('c') }}
    # stdlib("c")'s run-export records the libc floor (__glibc >=x.y on Linux,
    # __osx >=x.y on macOS) matching the zig -Dtarget triples in build.sh.
    # Without it the package declares no libc requirement at all and installs
    # happily on hosts too old to run it.
    - ${{ stdlib("c") }}
    - zig >=0.15.2,<0.16
    - pkg-config
  host:
    # Both carry run_exports, which pin the runtime requirement (ncurses
    # >=6.6,<7.0a0, zstd >=1.5.7,<1.6.0a0) more precisely than an explicit
    # unpinned run: entry would, so there is no run: section.
    - ncurses
    - zstd

tests:
  - script:
      - ncdu --version
  - package_contents:
      # strict: the payload is only the binary zig installs and the man page
      # build.sh installs by hand, so anything else appearing (a stray zig
      # cache directory, a silently relocated man page) fails the build.
      strict: true
      bin:
        - ncdu
      files:
        - share/man/man1/ncdu.1

about:
  license: MIT
  license_file: LICENSES/MIT.txt
  summary: NCurses Disk Usage
  description: |
    Ncdu is a disk usage analyzer with an ncurses interface. It is designed to
    find space hogs on a remote server where you don't have an entire graphical
    setup available, but it is a useful tool even on regular desktop systems.
    Ncdu aims to be fast, simple and easy to use, and should be able to run
    in any minimal POSIX-like environment with ncurses installed.
  homepage: https://dev.yorhel.nl/ncdu
  repository: https://g.blicky.net/ncdu.git/
  documentation: https://dev.yorhel.nl/ncdu/man

extra:
  recipe-maintainers:
    - chrisburr
    - carlodri
