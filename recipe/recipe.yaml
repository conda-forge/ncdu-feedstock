schema_version: 1

context:
  name: ncdu
  version: "2.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://dev.yorhel.nl/download/${{ name }}-${{ version }}.tar.gz
  sha256: 75f0ac3bce4fc012e8198b72518db5179e903079858efce08b912d5dcc7094d3

build:
  number: 0
  skip: win or ppc64le

requirements:
  build:
    # zig is a self-contained toolchain (bundled clang) and never invokes a
    # host C compiler, so compiler('c') is only wanted on macOS, where
    # build.sh reads ${MACOSX_DEPLOYMENT_TARGET} from its activation.
    - if: osx
      then:
        - ${{ compiler('c') }}
    # stdlib("c") is needed on every platform: its run-export is what records
    # the libc floor (__glibc >=x.y on Linux, __osx >=x.y on macOS) matching
    # the zig -Dtarget triples in build.sh. Without it the package declares no
    # libc requirement at all and installs happily on hosts too old to run it.
    # conda_build_config.yaml raises linux-aarch64 to 2.28, the only value
    # solvable against zig's own `sysroot_linux-aarch64 >=2.28` dependency.
    - ${{ stdlib("c") }}
    - zig 0.14.*
    - pkg-config
  host:
    - ncurses
    - zstd
  run:
    - ncurses
    - zstd

tests:
  - script:
      - ncdu --version

about:
  license: MIT
  license_file: LICENSES/MIT.txt
  summary: NCurses Disk Usage
  description: |
    Ncdu is a disk usage analyzer with an ncurses interface. It is designed to
    find space hogs on a remote server where you don't have an entire graphical
    setup available, but it is a useful tool even on regular desktop systems.
    Ncdu aims to be fast, simple and easy to use, and should be able to run
    in any minimal POSIX-like environment with ncurses installed.
  homepage: https://dev.yorhel.nl/ncdu
  repository: https://g.blicky.net/ncdu.git/
  documentation: https://dev.yorhel.nl/ncdu/man

extra:
  recipe-maintainers:
    - chrisburr
    - carlodri
